
spring.application.name=backend

# SQL Server konekcija
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AIFinanceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=aifinance_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JWT konfiguracija
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

# Recurring Transactions Scheduler
app.recurring.scheduler-enabled=false

# Ollama konfiguracija
app.ollama.base-url=http://localhost:11434
app.ollama.model=gemma3:4b

# Vrijeme zadržavanja modela u RAM-u nakon zahtjeva
app.ollama.keep-alive=30s
