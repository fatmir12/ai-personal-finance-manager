spring.application.name=backend

# SQL Server konekcija
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AIFinanceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=aifinance_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JWT konfiguracija
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=15